name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Warnings are errors here: the tree is at zero, and the React Compiler
      # advisories are the ones most likely to hide a real defect.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check first-load payload
        run: npm run check:size
