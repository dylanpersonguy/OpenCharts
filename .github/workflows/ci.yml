name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Warnings are errors here: the tree is at zero, and the React Compiler
      # advisories are the ones most likely to hide a real defect.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The production CSP is `script-src 'self'`; an inline <script> in the
      # built HTML would be blocked (and is exactly what the policy forbids).
      - name: Check CSP and security headers
        run: |
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          grep -q 'Content-Security-Policy:' dist/_headers
          if grep -P '<script(?![^>]*\bsrc=)' dist/index.html; then
            echo "inline <script> found in dist/index.html" >&2
            exit 1
          fi

      - name: Check first-load payload
        run: npm run check:size

      # The npm package is a separate build from the demo; build it too so a
      # packaging regression fails here, not in an integrator's install. The
      # CSS step also fails if any selector escapes the .opencharts scope.
      - name: Build library
        run: npm run build:lib

      - name: Check package shape
        run: npm run check:package
