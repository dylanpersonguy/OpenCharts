<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy: a strict <meta> policy is injected here by the
      "openbroker-security-headers" plugin in vite.config.ts for PRODUCTION
      builds only (dev needs inline scripts + HMR websocket). Source of truth:
      src/hyperliquid/compliance/csp.ts. frame-ancestors can only be sent as an
      HTTP header: see public/_headers and docs/deploy/.
    -->
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="OpenCharts — an open-source trading terminal with advanced charting, drawing tools, watchlist, DOM and a built-in paper-trading engine."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpenCharts" />
    <meta property="og:title" content="OpenCharts" />
    <meta
      property="og:description"
      content="Open-source trading terminal — advanced charts, drawing tools, and paper trading."
    />
    <meta property="og:type" content="website" />
    <title>OpenCharts — Open-Source Trading Terminal</title>
  </head>
  <body>
    <noscript>OpenBroker needs JavaScript to run. It is a non-custodial trading interface and cannot work without it.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
